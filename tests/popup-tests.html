<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Popup Tests</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1a1a1a; --muted:#666; --line:#e2e2e2;
          --pass:#1d7a1d; --pass-bg:#e8f6e8; --fail:#c00; --fail-bg:#ffe6e6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181a; --fg:#e8e8e8; --muted:#9aa0a6; --line:#33373b;
            --pass:#6ddb6d; --pass-bg:#16301a; --fail:#ff7b7b; --fail-bg:#3a1a1a; }
  }
  body { background:var(--bg); color:var(--fg); font:14px/1.5 -apple-system,Segoe UI,Arial,sans-serif;
         margin:0; padding:24px 16px; max-width:900px; margin-inline:auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.lead { color:var(--muted); margin:0 0 16px; }
  #summary { font:600 16px/1.5 inherit; padding:12px 16px; border-radius:8px; margin:16px 0; }
  #summary.ok { background:var(--pass-bg); color:var(--pass); }
  #summary.bad { background:var(--fail-bg); color:var(--fail); }
  #summary.run { background:#f0f0f0; color:#666; }
  .case { border-left:3px solid transparent; padding:6px 0 6px 12px; margin:2px 0; }
  .case.pass { border-color:var(--pass); }
  .case.fail { border-color:var(--fail); background:var(--fail-bg); }
  .tag { font:700 11px/1 monospace; padding:3px 6px; border-radius:3px; margin-right:8px; }
  .pass .tag { background:var(--pass); color:#fff; }
  .fail .tag { background:var(--fail); color:#fff; }
  iframe { width:320px; height:640px; border:1px solid var(--line); border-radius:8px; }
</style>
</head>
<body>

<h1>Popup — etkileşim testleri</h1>
<p class="lead">
  Eklenti penceresini gerçekten yükler ve <strong>anahtarların tıklanabildiğini</strong>
  doğrular. Bu dosya, anahtarların <code>&lt;span&gt;</code> ile kurulduğu ve yalnızca
  yazıya basınca çalıştığı bir hata yayına çıktığı için var.
</p>

<div id="summary" class="run">yükleniyor…</div>
<div id="out"></div>
<!-- src aşağıda JS ile veriliyor: tarayıcı önbelleği eski popup.html'i yükleyip
     testi yanlış yere düşürmesin. --><iframe id="popup" title="popup"></iframe>

<script>
const out = document.getElementById('out');
let passed = 0, failed = 0;

function report(ok, label, detail) {
  ok ? passed++ : failed++;
  const div = document.createElement('div');
  div.className = 'case ' + (ok ? 'pass' : 'fail');
  div.innerHTML = `<span class="tag">${ok ? 'PASS' : 'FAIL'}</span><span></span>`;
  div.querySelector('span:last-child').textContent = label + (ok || !detail ? '' : ` — ${detail}`);
  out.appendChild(div);
}

function run() {
  const doc = document.getElementById('popup').contentDocument;

  for (const id of ['enabled', 'badges', 'share']) {
    const input = doc.getElementById(id);
    if (!input) { report(false, `#${id} anahtarı bulunamadı`); continue; }

    const track = input.nextElementSibling;
    const wrapper = input.parentElement;

    report(wrapper.tagName === 'LABEL',
      `#${id}: anahtar bir <label> ile sarılmış`,
      `sarmalayıcı <${wrapper.tagName.toLowerCase()}>`);

    // Kullanıcının bastığı yer: görünen anahtar, yazı değil.
    const before = input.checked;
    track.click();
    report(input.checked !== before,
      `#${id}: görünen anahtara tıklayınca durum değişiyor`,
      'tıklama girdiye ulaşmıyor');
    input.checked = before;

    // Yazı da çalışmaya devam etmeli.
    const label = doc.querySelector(`label[for="${id}"]`);
    const before2 = input.checked;
    label.click();
    report(input.checked !== before2, `#${id}: yazıya tıklayınca da değişiyor`);
    input.checked = before2;
  }

  // Katkı anahtarı varsayılan olarak kapalı OLMALI.
  report(doc.getElementById('share').checked === false,
    'anonim katkı varsayılan olarak kapalı');

  const summary = document.getElementById('summary');
  summary.className = failed === 0 ? 'ok' : 'bad';
  summary.textContent = failed === 0
    ? `✓ All ${passed} checks passed.`
    : `✗ ${failed} of ${passed + failed} checks failed.`;
}

// popup.js chrome.* bulamayıp hata verecek; DOM yine de kurulmuş olur.
const frame = document.getElementById('popup');
frame.addEventListener('load', () => setTimeout(run, 60));
frame.src = `../extension/src/popup.html?t=${Date.now()}`;
</script>
</body>
</html>
